syntax = "proto3";

package blitzkit;

import "i18n.proto";

message CamouflageDefinitions {
  map<uint32, Camouflage> camouflages = 1;
}

message Camouflage {
  uint32              id             = 1;
  I18nString          name           = 2;
  optional I18nString tank_name      = 3;
  optional I18nString tank_name_full = 4;
}