syntax = "proto2";

package blitzkit;

import "consumable_definitions.proto";
import "i18n.proto";

message ProvisionDefinitions {
  map<uint32, Provision> provisions = 1;
}

message Provision {
  reserved 3; // crew

  required uint32                id                  = 1;
  required I18nString            name                = 2;
  required bool                  game_mode_exclusive = 5;
  repeated TankInclusivityFilter include             = 6;
  repeated TankInclusivityFilter exclude             = 7;
}