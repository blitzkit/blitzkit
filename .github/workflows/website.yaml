name: Website

on:
  push:
    branches:
      - main
      - production

  pull_request:

  schedule:
    - cron: "0 4 * * *"

  workflow_dispatch:
    inputs:
      branch:
        description: Branch

        type: choice
        required: true
        default: production

        options:
          - production
          - main

      environment:
        description: Environment

        type: choice
        required: true
        default: production

        options:
          - development
          - beta
          - production
          - preview
          - opentest

      client_provider:
        description: Client provider

        type: choice
        required: true
        default: steam

        options:
          - steam
          - zip
          - wgpkg

      client_source:
        description: Client source

        type: string
        required: true
        default: 444200/windows

permissions:
  contents: read
  # pull requests download the client that trusted runs publish
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.environment || github.ref }}
  cancel-in-progress: true

env:
  # client
  STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
  STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
  CLIENT_PROVIDER: ${{ inputs.client_provider || 'steam' }}
  CLIENT_SOURCE: ${{ inputs.client_source || '444200/windows' }}
  CLIENT_DIR: ../../temp/game

  # blitzkit
  PUBLIC_ENVIRONMENT: ${{ inputs.environment || 'production' }}
  PUBLIC_PROMOTE_OPENTEST: false
  PUBLIC_STATIC_ASSET_BASE: https://assets.blitzkit.app
  PUBLIC_GUIDE_WEBSITE: https://guidesblitz.com

  # blitz
  WOTB_GLOSSARY: ${{ secrets.WOTB_GLOSSARY }}
  WOTB_GLOSSARY_DOMAIN: ${{ secrets.WOTB_GLOSSARY_DOMAIN }}
  WOTB_GLOSSARY_PATH: ${{ secrets.WOTB_GLOSSARY_PATH }}

  # google
  PUBLIC_GOOGLE_TAG_MANAGER_ID: ${{ secrets.PUBLIC_GOOGLE_TAG_MANAGER_ID }}

  # wargaming
  PUBLIC_WARGAMING_APPLICATION_ID: ${{ secrets.PUBLIC_WARGAMING_APPLICATION_ID }}

jobs:
  # pull requests can't have the secrets that downloading the client takes, so
  # trusted runs share it with them instead
  client:
    name: Publish client

    if: ${{ github.event_name == 'schedule' || github.event_name == 'push' }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      # to replace the previously published client
      actions: write

    steps:
      # unlike the build, this checks out the workflow's own commit, which is
      # sure to have the download scripts
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Download client
        run: bun run download-client

      - name: Download SmartDLC
        if: ${{ env.CLIENT_PROVIDER == 'steam' }}

        run: bun run download-smart-dlc

      - name: Download glossary
        run: bun run download-glossary

      - name: Upload client
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: client
          path: |
            temp/game
            temp/glossary
            temp/glossary.json
          if-no-files-found: error
          retention-days: 1
          # the game's files are already compressed
          compression-level: 0

      - name: Delete older clients
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}

        run: |
          IDS=$(gh api --paginate "repos/${{ github.repository }}/actions/artifacts?name=client" \
            --jq ".artifacts[] | select(.id != $ARTIFACT_ID) | .id")

          for ID in $IDS; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$ID"
          done

  build:
    name: Build website

    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        chunk: [default, api, models_tanks, models_legendary, models_maps]

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main

      - name: Checkout
        uses: actions/checkout@v6
        with:
          # the PR's ref, or the manual input, or production (selected when cron)
          ref: ${{ github.event.pull_request.head.sha || inputs.branch || 'production' }}
          # pull requests can't reach the private submodule, nor do they need it
          submodules: ${{ github.event_name == 'pull_request' && 'false' || 'recursive' }}
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Setup CLIs
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 libarchive-tools

      # the scripts depend on the private submodule, and the build uses neither
      - name: Remove private packages
        if: ${{ github.event_name == 'pull_request' }}

        run: rm -rf packages/closed packages/scripts

      - name: Install dependencies
        run: bun install

      - name: Download client
        if: ${{ github.event_name != 'pull_request' }}

        run: bun run download-client

      - name: Download SmartDLC
        if: ${{ github.event_name != 'pull_request' && env.CLIENT_PROVIDER == 'steam' }}

        run: bun run download-smart-dlc

      - name: Find published client
        id: client
        if: ${{ github.event_name == 'pull_request' }}

        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          RUN_IDS=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=client" \
            --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | reverse | .[].workflow_run.id')
          RUN_ID=""

          # any run can upload an artifact by this name, so only the trusted
          # runs that publish the client are believed
          for ID in $RUN_IDS; do
            EVENT=$(gh api "repos/${{ github.repository }}/actions/runs/$ID" --jq .event)

            if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "push" ]; then
              RUN_ID=$ID
              break
            fi
          done

          if [ -z "$RUN_ID" ]; then
            echo "::error::No client has been published yet; a scheduled or push run publishes one"
            exit 1
          fi

          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download published client
        if: ${{ github.event_name == 'pull_request' }}

        uses: actions/download-artifact@v4
        with:
          name: client
          path: temp
          run-id: ${{ steps.client.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Build
        run: bun run --bun build
        env:
          CHUNK: ${{ matrix.chunk }}

          # pull requests have no secrets, so they read the published glossaries
          # and stand in for the public ids
          WOTB_GLOSSARY: ${{ github.event_name == 'pull_request' && format('file://{0}/temp/glossary.json', github.workspace) || secrets.WOTB_GLOSSARY }}
          WOTB_GLOSSARY_DOMAIN: ${{ github.event_name == 'pull_request' && format('file://{0}/temp/glossary', github.workspace) || secrets.WOTB_GLOSSARY_DOMAIN }}
          WOTB_GLOSSARY_PATH: ${{ github.event_name == 'pull_request' && '.json' || secrets.WOTB_GLOSSARY_PATH }}
          PUBLIC_GOOGLE_TAG_MANAGER_ID: ${{ github.event_name == 'pull_request' && 'pull-request' || secrets.PUBLIC_GOOGLE_TAG_MANAGER_ID }}
          PUBLIC_WARGAMING_APPLICATION_ID: ${{ github.event_name == 'pull_request' && 'pull-request' || secrets.PUBLIC_WARGAMING_APPLICATION_ID }}

      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.chunk }}
          path: dist/website
          # pull requests aren't deployed, so their builds are only kept a day
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 0 }}

      - name: Trigger deployment

        # workflow should trigger if:
        # - is by cron and is on main: triggering to production
        # - is by push and is on production: triggering to production
        # - is by manual and is on anything: triggering to anything
        if: >-
          ${{
            (github.event_name == 'schedule' && github.ref == 'refs/heads/main')
            || (github.event_name == 'push' && github.ref == 'refs/heads/production')
            || (github.event_name == 'workflow_dispatch')
          }}

        env:
          TOKEN: ${{ secrets.GH_NODE_DEPLOY_TOKEN }}
          CHUNK: ${{ matrix.chunk }}

        run: |
          ENV_FILE="environments/${PUBLIC_ENVIRONMENT}.json"
          TARGET_REPO=$(jq -r ".nodes.\"$CHUNK\"" "$ENV_FILE")

          if [ "$TARGET_REPO" == "null" ] || [ -z "$TARGET_REPO" ]; then
            exit 1
          fi

          curl \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.github.com/repos/$TARGET_REPO/dispatches" \
            -d "{
                  \"event_type\": \"deploy-pages\",
                  \"client_payload\": {
                    \"source_repo\": \"${{ github.repository }}\",
                    \"run_id\": \"${{ github.run_id }}\",
                    \"artifact_id\": \"${{ steps.upload.outputs.artifact-id }}\",
                    \"chunk\": \"$CHUNK\"
                  }
                }"
